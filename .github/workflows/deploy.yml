# GitHub Pages deployment for the story-generator distribution.
#
# WHY THIS WAS REWRITTEN (cross-ref diagnosis 2026-09-11):
# The previous version of this workflow used peaceiris/actions-gh-pages@v4
# to force-push dist/ onto the gh-pages branch, relying on the repo's
# Pages setting "Deploy from a branch" to pick it up. That pipeline broke:
#   - gh-pages WAS updated by the workflow (commits c44f02d on 2026-09-09,
#     e8a637a on 2026-09-10, containing assets/index-BSc0xfGq.js).
#   - But the live site (https://erosire.github.io/story-generator/) still
#     served an OLDER bundle (assets/index-Eg-Q13IJ.js) — evidence the
#     Pages branch-build stopped triggering after the last successful
#     Pages deployment event (2026-09-08T14:57:45Z, sha 1bbd245 "Create
#     CNAME"). GitHub's branch-based Pages builds are also notoriously
#     flaky/silent when a CNAME or custom-domain state gets involved.
#   - The Actions runs themselves were green (run #5 for 40ba2e5 succeeded),
#     so the failure was purely in the Pages publishing half.
#
# FIX: switch to the official artifact-based Pages flow — identical to the
# one that works in distribution/ScriptingSpaceFormatter
# (.github/workflows/deploy-pages.yml). This publishes dist/ directly
# through actions/deploy-pages@v4 and does NOT depend on the gh-pages
# branch or on "Deploy from a branch" builds at all.
#
# ONE-TIME REPO SETTING (required, not per-deploy):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The old gh-pages branch becomes unused after this and can be deleted
# (it no longer receives updates once this workflow is in place).
#
# Dependency notes (carried over from the previous workflow):
# - Environment constants (host + ports) live in the local src/config.ts —
#   the monorepo's @config/environment package cannot be published to npm.
# - @underload/service is unpublished and only used by server/test code —
#   never by the static Pages build — so it is stripped from package.json
#   below to keep `npm install` free of registry 404s.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# deploy-pages@v4 needs id-token (OIDC) + pages write; checkout needs read.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; new pushes cancel in-flight deploys
# (same concurrency guard the working ScriptingSpaceFormatter uses).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Strip server-only dependency
        run: |
          node <<'EOF'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete manifest.dependencies['@underload/service'];
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 4) + '\n');
          EOF

      # --legacy-peer-deps: npm's strict peer resolver crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on this
      # dependency tree (vitest 4 + jsdom peer sets) and aborts the install.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: npm run build

      # Artifact-based Pages publishing (replaces the gh-pages branch push):
      # configure-pages reads/applies repo Pages settings, upload-pages-
      # artifact packages dist/, deploy-pages publishes it in the deploy job.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
